name: Create Plugin Release

on:
  pull_request:
    types:
      - closed
    branches:
      - 'trunk'
  # Manual re-trigger: if a release run failed after the PR was already merged,
  # dispatch this against the merged release PR to finish (or re-run) the release.
  # Every mutating step in create-release.mjs is idempotent, so this is safe.
  workflow_dispatch:
    inputs:
      pr:
        description: 'Merged release PR number to build the release from'
        required: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    name: Crowdsignal Forms Release
    # The default GITHUB_TOKEN is read-only on repos that don't opt into
    # read-write workflow permissions. This job pushes commits and tags, creates
    # a GitHub release, and comments on the PR, so grant those writes explicitly.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # PR number comes from the merge event, or the workflow_dispatch input.
    env:
      PR_NUMBER: ${{ github.event.number || github.event.inputs.pr }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Check out trunk as a real local branch, not the detached-HEAD merge
          # ref, so create-release.mjs can `git push origin HEAD`. On a merge event
          # this is the PR's base_ref; on workflow_dispatch it's the dispatched ref.
          ref: ${{ github.base_ref || github.ref_name }}
      - name: Comment on PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh pr comment "$PR_NUMBER" --body "🚀 **[Release workflow started](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18.13.0'
      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: '9'
      - name: Install JS dependencies
        # --no-frozen-lockfile so CI can reconcile the release-tooling devDeps
        # that aren't yet in pnpm-lock.yaml. (In CI, pnpm defaults frozen=true.)
        run: pnpm install --no-frozen-lockfile
      - name: Setup Git
        run: |
          git config user.name "Crowdsignal Bot"
          git config user.email "<robot@crowdsignal.com>"
      - name: Create Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/create-release.mjs "$PR_NUMBER"
      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.WORDPRESSORG_SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.WORDPRESSORG_SVN_USERNAME }}
          BUILD_DIR: dist/crowdsignal-forms
          SLUG: crowdsignal-forms
          VERSION: ${{ steps.create_release.outputs.version }}
      - name: Comment on PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh pr comment "$PR_NUMBER" --body "🚀 Release **${{ steps.create_release.outputs.version }}** pushed to WordPress.org — [confirm the release email](https://wordpress.org/plugins/crowdsignal-forms/advanced/) to publish it to users."
